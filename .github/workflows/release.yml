name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify the tarball without staging anything
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    # Trusted publishing only works on GitHub-hosted runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # Node 24 ships npm 11.x, but OIDC trusted publishing needs >= 11.5.1, so pull
      # the current npm rather than rely on whatever is bundled.
      - name: Use a recent npm
        run: |
          npm install -g npm@latest
          npm --version
      - run: bun install --frozen-lockfile
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json $pkg" >&2
            exit 1
          fi
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Verify packaging only
        if: inputs.dry_run
        run: npm publish --dry-run
      # No NODE_AUTH_TOKEN: authentication is the OIDC token from id-token: write,
      # and provenance is generated automatically for a public repo + public package.
      # The trusted publisher on npmjs.com allows both `npm publish` and
      # `npm stage publish`; swap the command below to stage for a 2FA approval step.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish
